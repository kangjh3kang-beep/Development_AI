name: Deploy to Oracle Cloud

# ★이 워크플로는 **프론트 서버(158·compose 가 실서비스) 전용**이다.
#   실행하는 것이 `scripts/safe-deploy.sh` 이고, 그 스크립트는 compose 스택을 갱신한다.
#   ★★백엔드(168)는 **compose 밖**의 수동 컨테이너(`propai-api-800x`)를 caddy 가 프록시하므로
#     정본이 다르다 — `infra/deploy-zero-downtime.sh`(블루그린). 168 을 여기에 물리면
#     `safe-deploy.sh` 의 **서버 역할 가드가 exit 10 으로 막는다**(#668). 막히는 건 옳지만
#     45분 타임아웃까지 가기 전에 아래 preflight 에서 먼저 잡는다.
#   → 즉 `ORACLE_SSH_HOST` 시크릿을 넣어 자동배포를 켜면 **158 자동배포만** 살아난다.
#     168 은 여전히 수동이며, 그 사실을 여기 적어 두지 않으면 "자동배포 부활"로 오독된다.

on:
  # ★★2026-09-10 — `push: branches: [main]` 이 **있었고, 그것을 지웠다.**
  #
  #   왜: 실측 **400건 중 성공 0**(cancelled 308 + failure 92 · 워크플로 283263867 전수 페이징).
  #   푸시 트리거가 만든 실행의 **측정된 효과는 둘뿐**이었다 —
  #     ①`oracle-production` 승인 게이트에 실행을 쌓아 **concurrency 그룹을 영구 점유**
  #       (2026-08-20 부터 20일간 점유 → 이후 308건이 연쇄 `cancelled`)
  #     ②그 `pending` 을 사람이 «곧 나간다» 로 오독 — 2026-09-10 하루에 **두 세션**이 그랬다
  #   ★그리고 지금은 **성공할 수도 없다**: `ORACLE_SSH_HOST`·`ORACLE_SSH_KEY` 가 **미등록**이라
  #     (실측 2026-09-10 · repo/env 시크릿 조회 `ORACLE_*` 0건) `Validate Oracle deployment
  #     secrets`(아래 :149) 에서 죽는다. 92건이 실제로 그렇게 죽었다.
  #   ⇒ 편익 **0** · 해악 **측정됨**. 그래서 지운다.
  #
  #   ★**되살리는 법**(지우기만 하고 길을 안 남기면 그게 더 나쁘다):
  #     ①`ORACLE_SSH_HOST`·`ORACLE_SSH_KEY`(필요시 `ORACLE_SSH_USER`/`PORT`/`DEPLOY_PATH`) 등록
  #     ②`oracle-production` 의 `required_reviewers` 를 **자동배포에 맞게** 재검토
  #       (승인 게이트 + 자동 트리거는 **매 머지마다 사람이 눌러야** 나간다 — 그 조합이 이 사고다)
  #     ③아래 블록을 되살린다:  `push: {branches: [main]}`
  #     ④되살리기 전에 **`cancel-in-progress` 가 `waiting` 을 취소하는지 먼저 재라**
  #       (계획서 §3-4 에 재측정 명령이 있다 — 미측정이다)
  #
  #   ★실제 배포 경로는 그대로 살아 있다 — 통합자 세션의 수동 `safe-deploy.sh web main`
  #     (보드 147·148주기) 과 아래 `workflow_dispatch`.
  workflow_dispatch:
    inputs:
      target:
        description: "Oracle compose service target"
        required: true
        # ★★2026-09-10 — `both` 였다. 이것이 **사람이 실제로 누르는 값**이다:
        #   `Run workflow` 드롭다운에 미리 선택돼 있어, 그대로 누르면 158 에서
        #   `safe-deploy.sh both` 가 돈다. env 폴백만 고치고 여기를 두면 **형제 축이 남는다**
        #   (실측: 이 줄을 `api` 로 바꾸는 변이가 **SURVIVED** — 락이 못 봤다).
        default: web
        type: choice
        options:
          - both
          - web
          - api
      deploy_ref:
        description: "Git ref to deploy. Empty means the selected workflow ref."
        required: false
        type: string
      web_url:
        description: "Public web URL for smoke checks. Empty uses ORACLE_WEB_URL secret."
        required: false
        type: string
      health_url:
        description: "Public health URL for smoke checks. Empty uses ORACLE_HEALTH_URL secret."
        required: false
        type: string

concurrency:
  group: oracle-deploy
  # ★★2026-09-10 — `false` 였고, 그것이 **자동배포를 20일간 완전히 정지**시켰다.
  #   실측: 최근 100건 → **cancelled 99 · pending 1 · 성공 0**(대조군 CI 30건 success 27).
  #   원인은 2026-08-20 부터 `oracle-production` 승인 게이트에서 `waiting` 이던 실행 하나가
  #   **이 그룹을 점유**한 것이다. `false` 는 «먼저 온 것이 이긴다» 라서, 뒤이은 배포는
  #   전부 대기로 밀렸고 **그룹당 대기는 1개**뿐이라 다음 푸시가 앞의 대기를 취소했다.
  #   ⇒ 승인이 한 번 안 눌리면 **영구 정지**한다. 그리고 `cancelled` 는 *"누가 멈췄다"* 로
  #     읽혀 **실패처럼 보이지 않는다** — 오늘 두 세션이 `pending` 을 «곧 나간다» 로 오독했다.
  #   ★개입 실험으로 인과 확증(수치를 정확히 적는다 — 초판은 두 실행을 뭉갰다):
  #     **20일 묵은** 실행(`32319697071`)을 취소하니 **4시간 28분째** `pending` 이던 다른 실행
  #     (`34368615047`)이 **4초 만에** 시작했다(취소 `19:39:13Z` → 첫 잡 `19:39:17Z`).
  #     ★「4초」가 「즉시」보다 강한 증거다 — 과장이 오히려 증거를 약화시켰다.
  #   ★배포의 표준 의미론은 **「최신이 이긴다」** 이다. 되돌리지 마라.
  #   ★★맞바꾸는 위험을 **분모를 고쳐** 적는다. 초판은 *"그 창에 들어간 실행은 100건 중
  #     0건"* 이라고 썼는데, **그 0 은 배포가 한 번도 돌지 못했기 때문**이었다 —
  #     ***내가 폐지하려는 체제의 통계로 폐지 후의 위험을 계산했다***(§증거규율 5).
  #     올바른 분모로 다시 재면: 푸시 간격 **중앙값 23.1분**(n=99) vs 실행 소요 **22~28분**
  #     (게이트 5분26초 실측 + `safe-deploy.sh:76` 「16분」·`rollback-web.sh:3` 「22분+」)
  #     ⇒ 푸시 트리거가 살아 있었다면 **배포 과반이 절단**된다.
  #   ★그래서 위 `on:` 에서 **푸시 트리거 자체를 지웠다.** 남은 실행 생성원은 수동
  #     `workflow_dispatch` 뿐이고 그 간격은 시간 단위라(보드: 주기당 1회) 절단 창이 사실상 닫힌다.
  #   ★남는 위험(0 아님): 배포가 도는 중 **두 번째 dispatch** 를 누르면 `safe-deploy.sh:195`
  #     의 `docker stop; docker rm` ~ `:196` `compose up -d` 사이에서 끊길 때 **158 이 뜬다**.
  #     복구 경로는 `bash propai-platform/scripts/rollback-web.sh` 다(계획서 §4).
  #   ★★그리고 **이 값이 `waiting`(승인 대기) 실행까지 취소하는지는 미측정**이다 —
  #     GitHub 문서는 `pending`·`in progress` 만 서술한다. 안 한다면 이 줄은 무해하지만
  #     **교착을 푸는 것은 위 푸시 트리거 제거**이지 이 줄이 아니다. 계획서 §3-4 에 재측정 명령.
  cancel-in-progress: true

jobs:
  web-gate:
    name: Web deploy gate (배포 전 필수)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ★pnpm 은 외부 액션이 아니라 **corepack** 으로 켠다(2026-08-18).
      #   `pnpm/action-setup` 은 codeload 에서 tar 를 받는데 그 다운로드가 **429(Too Many
      #   Requests)** 로 실패해 `Set up job` 단계에서 죽었다 — 같은 날 PR 3건(#684·#687·#688)이
      #   **코드가 검사되지도 못한 채** 빨갰다(실측: 실패 job 로그 37줄 · 429 4건 ·
      #   tsc/eslint/vitest 진입 흔적 **0**).
      # ★형제 패턴: `propai-platform/Dockerfile.web:4` 가 이미 `corepack enable` 을 쓴다.
      # ★★버전 고정에는 **한정이 붙는다** — corepack 은 **cwd 에서 위로 올라가며**
      #   `package.json` 의 `packageManager` 를 찾는다. 이 레포는 **루트에 package.json 이 없고**
      #   `propai-platform/package.json` 에만 `pnpm@9.0.0` 이 있다. 따라서
      #   **`working-directory: propai-platform` 에서 pnpm 을 부를 때만** 9.0.0 이 보장된다.
      #   레포 루트에서 pnpm 을 부르면 corepack 이 **latest 를 내려받는다**
      #   (실측: `pnpm-11.22.0.tgz` — 루트에서 `pnpm config set` 을 돌렸다가 그렇게 됐다).
      #   → 루트에서 pnpm 을 부르는 스텝을 추가하지 마라.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # ★`cache: pnpm` 은 **제거했다**(2026-08-18 · #689 2차 실패 교훈).
          #   `actions/setup-node` 의 pnpm 캐시는 셋업 때 `pnpm store path` 로 경로를 잡고
          #   **post 에서 그 경로의 존재를 검증**하는데, corepack 경로에서 실제 설치 위치와
          #   갈려 post 가 죽었다(`Path Validation Error: … do(es) not exist`).
          #   경로를 `pnpm config set store-dir` 로 고정해 보려다 **더 나빠졌다** —
          #   그 명령이 레포 루트에서 돌아 corepack 이 latest(11.22.0)를 받고,
          #   `--global` 이 PATH 검사로 exit 1 을 내 **본체까지 막혔다.**
          #   → 이 PR 의 목적은 **429 의존 제거**이고 그건 달성됐다(1차 실행에서 본체 전부 success).
          #     캐시는 별건에서 `actions/cache` 로 경로를 **명시**해 되살린다 —
          #     그때 store 경로는 `propai-platform` 안에서 `pnpm store path` 로 얻어야 한다.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: propai-platform

      - name: Type check
        run: pnpm type-check
        working-directory: propai-platform/apps/web

      - name: Lint
        run: pnpm exec eslint . --quiet --no-cache
        working-directory: propai-platform/apps/web

      - name: Dashboard IA regression tests
        run: |
          pnpm test:run -- \
            'app/[locale]/(dashboard)/__tests__/dashboard-home-navigation.test.tsx' \
            'app/[locale]/(dashboard)/__tests__/dashboard-route-shells.test.tsx' \
            components/layout/nav-config.test.ts \
            lib/navigation/route-registry.test.ts
        working-directory: propai-platform/apps/web

  oracle-deploy:
    name: Deploy and smoke on Oracle Cloud
    runs-on: ubuntu-latest
    needs: web-gate
    timeout-minutes: 45
    environment:
      name: oracle-production
    env:
      # ★★2026-09-10 — 기본값이 `both` 였다. push 에는 `inputs` 가 없으므로 **자동배포는
      #   언제나 `both`** 로 굳는다. 그런데 이 워크플로는 **158(프론트) 전용**이고,
      #   `safe-deploy.sh both` 는 `build_one api` + `recreate_one api` 로 **158 에 api
      #   컨테이너를 만든다**(`safe-deploy.sh:146,211`). 진짜 API 는 **168 블루그린**이다.
      #   보드에 산출물로 박혀 있다 — `★158 의 api 컨테이너 수 = 0 유지 (both 회피를
      #   산출물로 확인)`(127주기). 통합자의 실제 배포도 **`safe-deploy.sh web main`**,
      #   즉 **web 축 단독**이다(147·148주기).
      #   ★★**초판의 서술이 거짓이었다**(적대 리뷰가 실측으로 반증 · 2026-09-10):
      #     *"한 번도 실행되지 못해서다 · 승인하는 순간 처음 터진다"* → **둘 다 틀렸다.**
      #     ①실행이력을 **페이징**하면 2026-08-12~08-20 에 배포 잡이 **92회 실제로 실행**됐다
      #       (「최근 100건」은 09-02~09-09 **7일**만 덮는다 — 창이 주장의 모집단이 아니었다).
      #     ②그 92건은 전부 `Validate Oracle deployment secrets`(:149) 에서 죽었고, 그 스텝은
      #       Preflight·Deploy 보다 **먼저** 돈다. `ORACLE_*` 시크릿이 **미등록**인 지금
      #       (실측: repo·env 조회 0건) **승인해도 `safe-deploy.sh` 에 도달하지 못한다.**
      #   ⇒ 이 기본값 수정은 「지금 안 고치면 터진다」가 **아니라 예방**이다. 시크릿이 등록되는
      #     날 처음 하중을 받는다. 그때 이 주석이 근거가 되도록 남긴다.
      #   ★★`both`·`api` 선택지를 **남기는 사유를 정정한다**(초판은 거짓이었다).
      #     초판: *"168 경로와 preflight 가드의 모집단이다"* → **둘 다 틀렸다.**
      #       · preflight(:164) 는 `DEPLOY_TARGET` 을 **보지 않는다** — **서버 역할**만 본다.
      #       · 168 정본 `infra/deploy-zero-downtime.sh` 는 이 워크플로가 **부르지 않는다**.
      #     ★진짜 사실은 더 강하다 — `propai-platform/nginx.conf:24-26` 이 `/api/` 를
      #       **168.110.125.89 로 직결**한다. 즉 158 에 api 를 구워도 **트래픽을 0 받는다**
      #       (이 저장소가 #630/#668 로 데인 「트래픽 없는 스택」 그 자체다).
      #     ⇒ 그러므로 이 워크플로에서 `api`/`both` 는 **언제나 158 을 향하고 언제나 틀리다.**
      #       그래도 지우지 않는 이유는 **하나뿐**이다: 158 에서 api 이미지를 굽는 **디버그
      #       경로**가 필요할 수 있다(트래픽은 0이다). 기본값에서 뺐으니 실수로 밟히지 않는다.
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'web' }}
      DEPLOY_REF: ${{ github.event.inputs.deploy_ref || github.ref_name }}
      ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
      ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH || '' }}
      ORACLE_INTERNAL_URL: ${{ secrets.ORACLE_INTERNAL_URL || 'http://localhost:80' }}
      ORACLE_WEB_URL: ${{ github.event.inputs.web_url || secrets.ORACLE_WEB_URL || 'https://4t8t.net' }}
      ORACLE_HEALTH_URL: ${{ github.event.inputs.health_url || secrets.ORACLE_HEALTH_URL || 'https://api.4t8t.net/health' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Oracle deployment secrets
        run: |
          missing=0
          for name in ORACLE_SSH_HOST ORACLE_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Oracle deployment"
              missing=1
            fi
          done
          case "$DEPLOY_TARGET" in
            web|api|both) ;;
            *) echo "::error::Invalid DEPLOY_TARGET=$DEPLOY_TARGET"; missing=1 ;;
          esac
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Preflight — 대상 서버가 프론트인지 확인
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -p "$ORACLE_SSH_PORT" -H "$ORACLE_SSH_HOST" >> ~/.ssh/known_hosts
          # ★판별 근거(2026-08-17 실측): 백엔드(168)에만 `~/caddy/Caddyfile` 이 있고
          #   프론트(158)에는 없다. `safe-deploy.sh` 의 역할 가드와 **같은 근거**를 쓴다.
          #   여기서 먼저 잡으면 45분 배포를 태우기 전에 멈춘다.
          role=$(ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_SSH_PORT" \
            -o StrictHostKeyChecking=yes "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" \
            'if [ -f "$HOME/caddy/Caddyfile" ]; then echo backend; else echo frontend; fi')
          echo "대상 서버 역할 = $role"
          if [ "$role" != "frontend" ]; then
            echo "::error::ORACLE_SSH_HOST 가 **백엔드 서버**를 가리킨다(~/caddy/Caddyfile 존재)."
            echo "::error::이 워크플로는 scripts/safe-deploy.sh 를 돌리는 158 전용이다."
            echo "::error::백엔드는 infra/deploy-zero-downtime.sh(블루그린)로 배포한다."
            exit 1
          fi

      - name: Deploy over SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -p "$ORACLE_SSH_PORT" -H "$ORACLE_SSH_HOST" >> ~/.ssh/known_hosts

          q() { printf "%q" "$1"; }
          REMOTE_ENV="ORACLE_DEPLOY_PATH=$(q "$ORACLE_DEPLOY_PATH") DEPLOY_REF=$(q "$DEPLOY_REF") DEPLOY_TARGET=$(q "$DEPLOY_TARGET") ORACLE_INTERNAL_URL=$(q "$ORACLE_INTERNAL_URL")"
          ssh -i ~/.ssh/oracle_deploy_key \
            -p "$ORACLE_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" \
            "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${ORACLE_DEPLOY_PATH:-$HOME/Development_AI}"
          VERIFY_BASE_URL="$ORACLE_INTERNAL_URL" \
            bash propai-platform/scripts/safe-deploy.sh "$DEPLOY_TARGET" "$DEPLOY_REF"
          echo "== deploy status =="
          cat /tmp/deploy_status.txt
          REMOTE

      - name: Public smoke checks
        run: |
          set -euo pipefail
          if [ -z "$ORACLE_WEB_URL" ]; then
            ORACLE_WEB_URL="https://4t8t.net"
          fi
          ORACLE_WEB_URL="${ORACLE_WEB_URL%/}"
          if [ -z "$ORACLE_HEALTH_URL" ]; then
            ORACLE_HEALTH_URL="https://api.4t8t.net/health"
          fi

          curl -fsSL --max-time 20 "$ORACLE_HEALTH_URL" >/tmp/oracle-health.json
          curl -fsSL --max-time 20 "$ORACLE_WEB_URL/ko" >/tmp/oracle-home.html
          curl -fsSL --max-time 20 "$ORACLE_WEB_URL/ko/analysis" >/tmp/oracle-analysis.html

          echo "Oracle smoke passed:"
          echo "- health: $ORACLE_HEALTH_URL"
          echo "- home: $ORACLE_WEB_URL/ko"
          echo "- analysis: $ORACLE_WEB_URL/ko/analysis"

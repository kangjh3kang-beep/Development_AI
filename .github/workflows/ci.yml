name: CI

on:
  push:
    branches: [main]
    # 워크플로우 자신 포함 — CI 정의만 바꾼 PR이 CI 미발화로 무검증 머지되던 갭 봉합
    # (paths 필터가 propai-platform/** 뿐이라 .github 변경은 트리거 밖이었음).
    paths: ["propai-platform/**", ".github/workflows/ci.yml"]
  # ★pull_request는 paths 필터 없이 항상 발화 — 브랜치보호 required check가 워크플로우
  #   레벨 paths 스킵과 만나면 문서 전용 PR이 "Expected" 영구대기로 차단되는 함정이 있다.
  #   경로 판별은 아래 changes 잡(잡 레벨 if)으로 이관: GitHub는 if로 스킵된 잡을
  #   required 충족으로 취급하므로, 문서 PR은 3잡 스킵으로 통과·플랫폼 PR은 전체 실행.
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - name: Filter paths (PR만 판별 — push/dispatch는 항상 전체 실행)
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        # ★R1 하드닝: 판별 실패는 반드시 '전체 실행'으로 귀결(fail-safe) — 이 잡의 실패가
        #   하위 required 잡 skip=충족(fail-open 무검증 머지)으로 새지 않게. here-string은
        #   대형 PR에서 printf|grep-q/head 조합의 SIGPIPE+pipefail 오판을 원천 제거.
        #   잔여 실패(러너 사망 등) 대비로 브랜치보호에 'Detect changes'도 required 등록.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "platform=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "files API 실패 — 안전측 전체 실행"
            echo "platform=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head -50 <<<"$FILES" || true
          if grep -qE '^(propai-platform/|\.github/workflows/ci\.yml$)' <<<"$FILES"; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propai-platform
    # ★2026-08-16 — 이 잡에는 DB가 없었다. 그 결과 `app/core/idempotency.py` 처럼 **fail-open**
    #   으로 설계된 모듈(DB를 못 쓰면 조용히 "처음 보는 키"로 판정)은, 무엇을 단언하든 통과하는
    #   **공허한 초록**이었다 — `ON CONFLICT (COALESCE(...), ...)` 표현식 인덱스가 진짜
    #   Postgres 에서 성립하는지조차 확인된 적이 없다. 돈 가드에서 그건 허용할 수 없다.
    #   ★★포트를 **5432 가 아니라 55432** 로 연다. 기본 `DATABASE_URL` 은 5432 를 가리키므로,
    #     5432 에 DB 를 띄우면 "DB 가 없을 때 우아하게 동작하는가"를 검증하던 기존 테스트들이
    #     전제를 잃고 깨진다(실측: 그 조건에서 3건이 빨개진다 — 성장루프 e2e·원장 경쟁·지출원장).
    #     즉 이 잡에 DB 를 그냥 붙이면 **내가 회귀를 만든다.** 새 테스트만 `TEST_PG_DSN` 으로
    #     명시 접속하고, 나머지 스위트가 보는 세상은 종전 그대로 둔다.
    #   ★이 서비스가 없으면 `tests/test_charge_idempotency.py` 는 skip 이 아니라 **fail** 한다
    #     (CI 환경변수로 감지 — fail-open 모듈에서 skip 은 곧 무잠금이다).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propai_user
          POSTGRES_PASSWORD: propai_pass_dev
          POSTGRES_DB: propai_db
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U propai_user -d propai_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: propai-platform/apps/api/requirements.txt

      - name: Install GDAL native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # gdal 파이썬 바인딩은 시스템 libgdal 버전과 일치해야 소스빌드된다. requirements의 정확핀 대신
          # 시스템 버전으로 먼저 설치하면, 이후 requirements(gdal 범위)는 충족돼 재빌드하지 않는다.
          export CPLUS_INCLUDE_PATH=/usr/include/gdal
          export C_INCLUDE_PATH=/usr/include/gdal
          pip install "gdal==$(gdal-config --version)"
          pip install -r apps/api/requirements.txt

      # ★#148로 위반 0 달성(전면 --fix+무해규칙 ignore) → W1-9에서 차단(required) 게이트로
      #   승격. 위반 0 시점의 차단화라 기존 PR에 비용 없음; ignore 규칙은 점진 해제.
      # ★버전을 핀한다(2026-08-16 실사고). 종전 `pip install ruff` 는 실행마다 **최신**을 받아,
      #   로컬 0.15.7 통과 / CI 0.16.3 실패가 **같은 명령으로** 났다(명령이 아니라 버전이 달랐다).
      #   린터 릴리스 하나가 **코드 변경 0으로 전 PR 을 빨갛게** 만들 수 있고, 원인이 자기 diff 에
      #   없어 진단이 길다(CI 한 사이클 ≈ 16분). 정본은 requirements-dev.txt —
      #   로컬에서도 같은 제약으로 설치하면 CI 와 같은 결과가 난다.
      # ★`-r` 이 아니라 **`-c`(제약)** 를 쓴다. `-r` 로 하면 이 **필수 잡**에 bandit·pip-audit 까지
      #   설치돼 패키지가 1개 → **32개**로 늘고(PyYAML·packaging·requests·certifi·urllib3 …),
      #   이미 설치된 api 의존성과 버전이 충돌할 여지를 임계경로에 들인다(실측 dry-run).
      #   `-c` 는 **설치 대상은 ruff 하나로 두고 버전만 핀**한다(dry-run 확인: 1개·0.16.3).
      - name: Ruff (lint)
        working-directory: propai-platform/apps/api
        run: |
          pip install -c requirements-dev.txt ruff
          python -m ruff check .

      - name: Run unit tests (apps/api)
        working-directory: propai-platform/apps/api
        # ★TEST_PG_DSN 만 실 DB 를 가리킨다(기본 DATABASE_URL=5432 는 그대로 비어 있다).
        #   과금 멱등 락은 fail-open 모듈이라 **실 Postgres 를 태우지 않으면 무잠금**이다.
        env:
          TEST_PG_DSN: postgresql+asyncpg://propai_user:propai_pass_dev@localhost:55432/propai_db
        # ★병렬화(2026-08-17) — 이 잡이 CI 임계경로다(총 16분 중 15~16분).
        #   CI 실측(같은 잡 안 연속 측정 · 러너 nproc=4):
        #     직렬     750초   9392 passed · 96 skipped · 3 xfailed
        #     -n auto  385초   9392 passed · 96 skipped · 3 xfailed   ← 완전 일치 = 회귀 0
        #   → 1.95배. 머지큐를 못 쓰는 저장소(개인 계정 소유)에서 사이클 비용을 줄이는
        #     **유일한 직접 레버**다. 리베이스 왕복(#649 5회·#658 3회)의 비용도 함께 준다.
        #   ★`-n auto` — 워커 수를 러너에 맡긴다(고정하면 러너 사양 변경 시 어긋난다).
        #   ★`-c` 로 설치한다(`-r` 아님) — 이 필수 잡에 불필요한 패키지를 들이지 않는다.
        run: |
          pip install -c requirements-dev.txt pytest-xdist
          python -m pytest tests/ -q --no-header -n auto

      # 루트 계약 스위트(propai-platform/tests) — 과거 CI 밖에서 17실패가 방치됐던
      # 갭을 게이트로 편입(931+ tests, 무DB). apps/api 스위트와 별개 커버리지.
      # ★여기는 **직렬을 유지한다** — 병렬 이득을 **재보지 않았다**(apps/api 만 쟀다).
      #   안 잰 것을 바꾸면 이득은 불확실한데 병렬 안전성 위험만 새로 들인다.
      - name: Run root contract suite (propai-platform/tests)
        working-directory: propai-platform
        run: python -m pytest tests/ -q --no-header

  frontend-checks:
    name: Frontend (type-check + lint + test)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★pnpm 은 외부 액션이 아니라 **corepack** 으로 켠다(2026-08-18).
      #   `pnpm/action-setup` 은 codeload 에서 tar 를 받는데 그 다운로드가 **429(Too Many
      #   Requests)** 로 실패해 `Set up job` 단계에서 죽었다 — 같은 날 PR 3건(#684·#687·#688)이
      #   **코드가 검사되지도 못한 채** 빨갰다(실측: 실패 job 로그 37줄 · 429 4건 ·
      #   tsc/eslint/vitest 진입 흔적 **0**). corepack 은 Node 에 동봉돼 있고 버전은
      #   `package.json` 의 `packageManager: pnpm@9.0.0` 이 정한다 — 외부 네트워크 의존이 사라진다.
      # ★형제 패턴: `propai-platform/Dockerfile.web:4` 가 이미 `corepack enable` 을 쓴다.
      #   정답이 저장소 안에 있었고 CI 만 다른 길을 가고 있었다.
      # ★★setup-node **앞**에 둔다. 그 액션의 `cache: pnpm` 은 셋업 중 `pnpm store path` 를
      #   호출하므로, pnpm 이 그 시점에 PATH 에 없으면 **셋업 자체가 죽는다**(러너 기본 Node 로
      #   corepack 을 켜 두면 그 셰임이 PATH 에 남는다). 순서가 뒤집히면 조용히 실패한다.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: propai-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: propai-platform

      # W1-9: tsc·eslint 현재 0 error(그린) → 차단 게이트로 승격(비차단은 게이트 착시).
      # eslint 경고(~190)는 --max-warnings 미설정이라 통과 — 경고 정리 후 0 게이트화 예정.
      - name: Type check
        run: pnpm type-check
        working-directory: propai-platform/apps/web

      - name: Lint
        run: pnpm lint
        working-directory: propai-platform/apps/web

      - name: Unit tests
        run: pnpm test:run
        working-directory: propai-platform/apps/web

  # ★next build 게이트 — 정적 프리렌더(Suspense 경계)·React Compiler 결함은 tsc/eslint를
  #   통과하고도 build에서만 표면화되어 배포서(158)에서 처음 발견되던 클래스였다
  #   (#398→#400 useSearchParams 프리렌더 fail·#408→#410 React Compiler error 전례).
  #   backend-tests(~14m)가 장대(critical path)라 병렬 잡 추가는 총 CI 시간을 늘리지 않는다.
  frontend-build:
    name: Frontend (next build)
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★pnpm 은 외부 액션이 아니라 **corepack** 으로 켠다(2026-08-18).
      #   `pnpm/action-setup` 은 codeload 에서 tar 를 받는데 그 다운로드가 **429(Too Many
      #   Requests)** 로 실패해 `Set up job` 단계에서 죽었다 — 같은 날 PR 3건(#684·#687·#688)이
      #   **코드가 검사되지도 못한 채** 빨갰다(실측: 실패 job 로그 37줄 · 429 4건 ·
      #   tsc/eslint/vitest 진입 흔적 **0**). corepack 은 Node 에 동봉돼 있고 버전은
      #   `package.json` 의 `packageManager: pnpm@9.0.0` 이 정한다 — 외부 네트워크 의존이 사라진다.
      # ★형제 패턴: `propai-platform/Dockerfile.web:4` 가 이미 `corepack enable` 을 쓴다.
      #   정답이 저장소 안에 있었고 CI 만 다른 길을 가고 있었다.
      # ★★setup-node **앞**에 둔다. 그 액션의 `cache: pnpm` 은 셋업 중 `pnpm store path` 를
      #   호출하므로, pnpm 이 그 시점에 PATH 에 없으면 **셋업 자체가 죽는다**(러너 기본 Node 로
      #   corepack 을 켜 두면 그 셰임이 PATH 에 남는다). 순서가 뒤집히면 조용히 실패한다.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: propai-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: propai-platform

      - name: Next build (prerender + React Compiler gate)
        run: pnpm build
        working-directory: propai-platform/apps/web

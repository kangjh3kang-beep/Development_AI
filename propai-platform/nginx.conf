events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # ── 백엔드 API 업스트림 ──────────────────────────────────────────────
    # ★이 서버(158)에 함께 떠 있는 api 컨테이너가 아니라, 백엔드 전용 서버(168)를 가리킨다.
    #
    # 왜: 158의 동거 api 컨테이너는 프론트 배포 때만 갱신되어 백엔드보다 몇 주씩 뒤처졌다.
    #     그 결과 https://4t8t.net/api/* 와 https://www.4t8t.net/api/* 가 구버전 API를,
    #     https://api.4t8t.net/* 는 최신 API를 서빙하는 "호스트별 백엔드 분기"가 생겼다.
    #     실사용자(SPA)는 절대 origin(api.4t8t.net)만 호출해 영향이 없었으나, 이 경로로
    #     점검하면 최신 기능이 없는 것처럼 보여 오진을 반복했다. 세 호스트를 한 백엔드로 수렴시킨다.
    #
    # 왜 :8000 이 아니라 :80(Caddy) 인가: 168은 무중단(블루-그린) 배포라 실제 앱 포트가
    #     8000↔8001 로 번갈아 바뀌고, Caddy(:80)가 그때그때 활성 포트로 넘겨준다.
    #     :8000 을 직접 가리키면 배포가 8001 에 안착한 순간 이 경로가 죽는다.
    upstream backend_api {
        server 168.110.125.89:80;
    }

    # Nginx 리버스 프록시 설정
    server {
        listen 80;
        server_name _;

        # 프런트엔드 정적 파일 캐싱 (Next.js 빌드 산출물 중 public 및 static 폴더 등)
        # standalone 모드에서는 Next.js가 자체적으로 서빙해주지만, Nginx에서 앞단 캐싱하면 더 빠릅니다. (선택사항)

        # 1. 백엔드 API 라우팅 (/api/*)
        location = /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 지원 (API 서버에서 WebSockets을 사용하는 경우)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 백엔드 연산이 길어질 수 있으므로 타임아웃 넉넉히 부여
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # FastAPI 문서 엔드포인트도 백엔드로 연결
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
        }

        # 2. 나머지 모든 요청은 프런트엔드(Next.js)로 라우팅
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js Hot Reload (개발 환경) 및 추후 Next.js WebSocket 지원용
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
